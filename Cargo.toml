[package]
name = "midden"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Find what is holding a JVM heap dump's memory: retained sizes, owners, leak suspects."
repository = "https://github.com/NullByte3/midden"
readme = "README.md"
license = "MIT"
keywords = ["jvm", "heap-dump", "hprof", "memory-leak", "java"]
categories = ["command-line-utilities", "development-tools::debugging"]

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
flate2 = "1"
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Counts are checked once where they are set (index.rs, cache.rs); the hot loops cast freely.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
# A binary: no public API to document, and the CLI arguments are bools by nature.
missing_errors_doc = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

# Nothing catches a panic and the cache is renamed into place, so aborting on one loses nothing.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
